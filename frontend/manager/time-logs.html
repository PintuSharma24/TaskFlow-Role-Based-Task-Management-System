
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Time Logs | TaskFlow</title>
    <link rel="stylesheet" href="../css/dashboard.css">
</head>
<body>

<div class="dashboard-container">

    <aside class="sidebar">
        <h2>TaskFlow</h2>

        <nav>
            <a href="dashboard.html">Dashboard</a>
            <a href="employees.html">My Employees</a>
            <a href="tasks.html">My Tasks</a>
            <a href="create-task.html">Create Task</a>
            <a href="task-history.html">Task History</a>
            <a href="time-logs.html" class="active">Time Logs</a>
        </nav>

        <button id="logoutButton">Logout</button>
    </aside>

    <main class="main-content">

        <header class="topbar">
            <h1>Employee Time Logs</h1>
            <p>Monitor employee working hours and task efforts.</p>
        </header>

        <section class="stat-card">

            <h3>Time Log Directory</h3>

            <div class="table-container">

                <table>
                    <thead>
                        <tr>
                            <th>Log ID</th>
                            <th>Employee</th>
                            <th>Task ID</th>
                            <th>Hours Worked</th>
                            <th>Description</th>
                            <th>Date</th>
                        </tr>
                    </thead>

                    <tbody id="managerTimeLogsTable">
                        <tr>
                            <td colspan="6">Loading time logs...</td>
                        </tr>
                    </tbody>

                </table>

            </div>

            <p id="timeLogsMessage" class="message"></p>

        </section>

    </main>

</div>

<script src="../js/api.js"></script>
<script src="../js/manager.js"></script>
<script src="../js/chatbot.js"></script>
</body>
</html>
