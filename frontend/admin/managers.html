
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Managers | TaskFlow</title>
    <link rel="stylesheet" href="../css/dashboard.css">
</head>
<body>

<div class="dashboard-layout">

    <aside class="sidebar">
        <h2 class="logo">TaskFlow</h2>

        <nav>
            <a href="dashboard.html">Dashboard</a>
            <a href="managers.html" class="active">Managers</a>
            <a href="employees.html">Employees</a>
        </nav>

        <button id="logoutButton" class="logout-btn">Logout</button>
    </aside>

    <main class="main-content">

        <header class="topbar">
            <div>
                <h1>Managers</h1>
                <p>View and manage all managers.</p>
            </div>
        </header>

        <section class="stat-card">
            <h3>All Managers</h3>

            <div class="table-container">
                <table>
                    <thead>
                        <tr>
                            <th>ID</th>
                            <th>Name</th>
                            <th>Email</th>
                            <th>Status</th>
                            <th>Action</th>
                        </tr>
                    </thead>

                    <tbody id="managersTableBody">
                        <tr>
                            <td colspan="5">Loading managers...</td>
                        </tr>
                    </tbody>
                </table>
            </div>

            <p id="managersMessage" class="message"></p>
        </section>

    </main>
</div>

<script src="../js/api.js"></script>
<script src="../js/admin.js"></script>

</body>
</html>
